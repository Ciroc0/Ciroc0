name: Contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate branded contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ciroc0
          outputs: |
            assets/contribution-snake.svg?palette=github-dark&color_snake=#EDF50B&color_dots=#171717,#303526,#666F21,#ABB71B,#EDF50B

      - name: Commit refreshed animation
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(profile): refresh contribution snake"
          file_pattern: assets/contribution-snake.svg
